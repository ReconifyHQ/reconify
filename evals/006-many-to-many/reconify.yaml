version: 1
sources:
  left:
    file_pattern: "left.csv"
    parser: &parser_config
      type: csv
      date_col: date
      date_layout: "2006-01-02"
      amount_col: amount
      currency_col: currency
      ref_col: reference
      name_col: description
  right:
    file_pattern: "right.csv"
    parser: *parser_config
pairs:
  left_vs_right:
    left: left
    right: right
    passes:
      - type: many_to_many

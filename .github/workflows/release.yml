name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # @v4

    - name: Verify tag and package versions
      shell: bash
      run: |
        set -euo pipefail

        TAG="$GITHUB_REF_NAME"
        SEMVER_PATTERN='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
        if [[ ! "$TAG" =~ $SEMVER_PATTERN ]]; then
          echo "Release tag must be semantic and start with v; got: $TAG" >&2
          exit 1
        fi

        VERSION="${TAG#v}"
        VERSION_FILE="$(tr -d '\r\n' < .version)"
        ROOT_PACKAGE_VERSION="$(jq -r '.version' package.json)"
        SKILLS_PACKAGE_VERSION="$(jq -r '.version' skills/package.json)"

        check_version() {
          local source="$1"
          local actual="$2"
          if [[ "$actual" == "$VERSION" ]]; then
            return
          fi

          echo "$source version must match release tag $TAG; got: $actual" >&2
          exit 1
        }

        check_version ".version" "$VERSION_FILE"
        check_version "package.json" "$ROOT_PACKAGE_VERSION"
        check_version "skills/package.json" "$SKILLS_PACKAGE_VERSION"

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # @v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # @v5
      with:
        go-version: '1.25.13'

    - name: Get version
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "build_time=$BUILD_TIME" >> $GITHUB_OUTPUT

    - name: Build binaries
      run: |
        mkdir -p dist
        VERSION=${{ steps.get_version.outputs.version }}
        BUILD_TIME=${{ steps.get_version.outputs.build_time }}
        
        # Linux
        GOOS=linux GOARCH=amd64 go build \
          -ldflags "-X main.Version=$VERSION -X main.BuildTime=$BUILD_TIME" \
          -o dist/reconify-linux-amd64 ./cmd/reconify
        
        # macOS Intel
        GOOS=darwin GOARCH=amd64 go build \
          -ldflags "-X main.Version=$VERSION -X main.BuildTime=$BUILD_TIME" \
          -o dist/reconify-darwin-amd64 ./cmd/reconify
        
        # macOS Apple Silicon
        GOOS=darwin GOARCH=arm64 go build \
          -ldflags "-X main.Version=$VERSION -X main.BuildTime=$BUILD_TIME" \
          -o dist/reconify-darwin-arm64 ./cmd/reconify
        
        # Windows
        GOOS=windows GOARCH=amd64 go build \
          -ldflags "-X main.Version=$VERSION -X main.BuildTime=$BUILD_TIME" \
          -o dist/reconify-windows-amd64.exe ./cmd/reconify

    - name: Create checksums
      run: |
        cd dist
        sha256sum * > checksums.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # @v2
      with:
        files: |
          dist/*
        body: |
          ## Reconify ${{ steps.get_version.outputs.version }}
          
          ### Downloads
          
          - **Linux (amd64)**: `reconify-linux-amd64`
          - **macOS (Intel)**: `reconify-darwin-amd64`
          - **macOS (Apple Silicon)**: `reconify-darwin-arm64`
          - **Windows (amd64)**: `reconify-windows-amd64.exe`
          
          ### Checksums
          
          See `checksums.txt` for SHA256 checksums of all binaries.
        draft: false
        prerelease: ${{ contains(steps.get_version.outputs.version, '-') }}

  publish-npm:
    name: Publish npm package
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # @v4

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # @v7
      with:
        node-version: '24'
        registry-url: 'https://registry.npmjs.org'
        package-manager-cache: false

    - name: Publish package
      working-directory: skills
      run: npm publish --access public

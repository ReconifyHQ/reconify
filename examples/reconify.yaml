version: 1
timezone: "UTC"

sources:
  bank:
    file_pattern: "data/bank/*.csv"
    parser:
      type: csv
      date_col: "Date"
      date_layout: "2006-01-02"
      tz: "UTC"
      amount_col: "Amount"
      decimal: "."
      thousands: ","
      multiplier: 100
      currency_col: "Currency"
      name_col: "Details"
      ref_col: "Reference"

  stripe:
    file_pattern: "data/stripe/*.csv"
    parser:
      type: csv
      date_col: "Date"
      date_layout: "2006-01-02"
      tz: "UTC"
      amount_col: "Amount"
      decimal: "."
      thousands: ","
      multiplier: 100
      currency_col: "Currency"
      name_col: "Description"
      ref_col: "Reference"

  paypal:
    file_pattern: "data/paypal/*.csv"
    parser:
      type: csv
      date_col: "Date"
      date_layout: "2006-01-02"
      tz: "UTC"
      amount_col: "Amount"
      decimal: "."
      thousands: ","
      multiplier: 100
      currency_col: "Currency"
      name_col: "Description"
      ref_col: "Reference"

  # installments: right-side source for one_to_many matching.
  # Each row is one payment installment. ref_col is the shared invoice number
  # (the matching key — all installments for the same invoice share this value).
  # group_col is a per-row-unique payment ID so the duplicate detector does not
  # flag installments as duplicates of each other.
  installments:
    file_pattern: "data/installments/*.csv"
    parser:
      type: csv
      date_col: "Date"
      date_layout: "2006-01-02"
      tz: "UTC"
      amount_col: "Amount"
      decimal: "."
      thousands: ","
      multiplier: 100
      currency_col: "Currency"
      ref_col: "InvoiceNumber"  # shared by all installments for one invoice
      group_col: "PaymentID"    # unique per row — prevents false-positive duplicates

pairs:
  bank_vs_stripe:
    left: bank
    right: stripe
    date_window: "1d"
    amount_tolerance_minor: 0
    name_mode: "tokens"
    # name_match_threshold is the minimum Jaccard token-overlap score (0 < x < 1)
    # a candidate must exceed for a name_mode=tokens match. Optional; defaults
    # to 0.5. 1.0 is rejected — the comparison is strict and a score never
    # exceeds 1.0, so that value would never match anything.
    name_match_threshold: 0.5

  # 1-N source example: reconcile bank against several counterparts in order.
  # Unmatched left transactions from one pass feed into the next — bank rows
  # not found in stripe are then checked against paypal. rights and right are
  # mutually exclusive; use rights for more than one counterpart.
  bank_vs_multiple:
    left: bank
    rights: [stripe, paypal]
    date_window: "1d"
    amount_tolerance_minor: 0

  # Explicit pipeline example: passes define the ordered matching strategy for
  # a single counterpart. This is different from rights, which selects which
  # counterpart sources to reconcile against. passes determines how rows are
  # matched within a counterpart. Omitting passes uses the default behavior:
  # reference matching followed by optional name_mode=tokens.
  bank_vs_stripe_pipeline:
    left: bank
    right: stripe
    date_window: "1d"
    amount_tolerance_minor: 0
    passes:
      - type: reference_one_to_one
      - type: name_tokens_one_to_one

  # one_to_many example: one left transaction (e.g. an invoice in the ledger)
  # settled by N right transactions sharing the same reference (e.g. installment
  # payments).
  #
  # The installments source above sets ref_col to the shared invoice number and
  # group_col to a per-row-unique payment ID. ref_col is the matching key used by
  # the one_to_many pass to group installments; group_col is used only by the
  # duplicate detector so installments are not flagged as duplicate rows.
  #
  # Use --format=json or --format=ndjson to capture grouped_matched,
  # grouped_amount_diff, grouped_timing_diff, and ambiguous_groups in output.
  # CSV and table formats warn about unsupported grouped events.
  #
  # --audit is not yet supported with one_to_many passes.
  #
  # Note on [reference_one_to_one, one_to_many] pipelines: the reference pass
  # picks the best 1-to-1 candidate for any left row with a matching reference,
  # including installments — if an installment shares a reference and its date is
  # within the window, the ref pass classifies it as amount_diff rather than
  # leaving it for the one_to_many pass. Use one_to_many alone when all right rows
  # are installments; add reference_one_to_one first only when some right rows are
  # genuine 1-to-1 matches and the installments are both outside the tolerance AND
  # outside the date window for each individual row.
  invoices_vs_installments:
    left: bank          # one row per invoice (aggregate amount)
    right: installments # N rows per invoice (installment payments); group_col set above
    date_window: "7d"
    amount_tolerance_minor: 0
    passes:
      - type: one_to_many  # sums all installments per invoice reference

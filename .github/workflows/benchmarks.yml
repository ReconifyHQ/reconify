name: Benchmarks

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  # PR/push gate: semantic parity smoke matrix including adversarial scenarios.
  # Fails on parity errors or smoke timeouts. Scale measurements are separate.
  benchmark-smoke:
    name: Benchmark Smoke
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    timeout-minutes: 10
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # @v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # @v5
      with:
        go-version: '1.25.11'

    - name: Run benchmark smoke checks
      env:
        BENCH_OUTPUT_DIR: ${{ runner.temp }}/reconify-benchmarks
      run: make bench-smoke

    - name: Upload benchmark logs on failure
      if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # @v4
      with:
        name: benchmark-smoke-logs
        path: |
          ${{ runner.temp }}/reconify-benchmarks/runs/**/summary.tsv
          ${{ runner.temp }}/reconify-benchmarks/runs/**/*.log
          ${{ runner.temp }}/reconify-benchmarks/runs/**/manifest.json
          ${{ runner.temp }}/reconify-benchmarks/runs/**/report.json

  # Scheduled/manual scale measurements. Parity failures are CI failures;
  # per-run scale timeouts on shared runners are recorded as warnings in
  # report.json and do not fail the job (shared-runner timing variability
  # is not a correctness signal).
  benchmark-scale:
    name: Benchmark Scale
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # @v4

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # @v5
      with:
        go-version: '1.25.11'

    - name: Run deterministic benchmarks (100k)
      env:
        BENCH_OUTPUT_DIR: ${{ runner.temp }}/reconify-benchmarks
      run: make bench-deterministic

    - name: Run realistic benchmarks (100k)
      env:
        BENCH_OUTPUT_DIR: ${{ runner.temp }}/reconify-benchmarks
      run: make bench-realistic

    - name: Run adversarial benchmarks (100k)
      env:
        BENCH_OUTPUT_DIR: ${{ runner.temp }}/reconify-benchmarks
      run: make bench-adversarial

    - name: Upload benchmark artifacts
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # @v4
      with:
        name: benchmark-scale-results
        path: |
          ${{ runner.temp }}/reconify-benchmarks/runs/**/summary.tsv
          ${{ runner.temp }}/reconify-benchmarks/runs/**/*.log
          ${{ runner.temp }}/reconify-benchmarks/runs/**/manifest.json
          ${{ runner.temp }}/reconify-benchmarks/runs/**/report.json

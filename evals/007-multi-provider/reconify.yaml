version: 1
sources:
  left:
    file_pattern: "left.csv"
    parser: &parser_config
      type: csv
      date_col: date
      date_layout: "2006-01-02"
      amount_col: amount
      currency_col: currency
      ref_col: reference
      name_col: description
  stripe:
    file_pattern: "stripe.csv"
    parser: *parser_config
  paypal:
    file_pattern: "paypal.csv"
    parser: *parser_config
pairs:
  left_vs_multiple:
    left: left
    rights: [stripe, paypal]
